name: Proposal review

on:
  pull_request:
    paths:
      - "proposals/**"
      - ".agents/skills/research-content-proposals/**"
      - "scripts/validate-proposals.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate-proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build canonical context
        run: npm run validate
      - name: Validate every staged proposal
        run: npm run validate:proposals
