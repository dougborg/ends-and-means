name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types and Astro files
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Test rendered routes
        run: npm run test:routes

      - name: Install browser for rendered-page review
        run: npx playwright install --with-deps chromium

      - name: Review rendered pages
        run: npm run test:visual

      - name: Upload rendered-page review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-page-review
          path: .artifacts/visual-review
          if-no-files-found: ignore
