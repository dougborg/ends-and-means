name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source and configuration
        run: npm run lint

      - name: Find unused files and dependencies
        run: npm run static

      - name: Audit installed dependencies
        run: npm audit --audit-level=high

      - name: Check types and Astro files
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Test rendered routes
        run: npm run test:routes

      - name: Install browser for rendered-page review
        run: npx playwright install --with-deps chromium

      - name: Review rendered pages
        run: npm run test:visual

      - name: Upload rendered-page review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rendered-page-review
          path: .artifacts/visual-review
          if-no-files-found: ignore
