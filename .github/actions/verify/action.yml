name: Verify and build
description: Run the repository quality, test, build, route, and browser checks.

inputs:
  upload-pages-artifact:
    description: Upload the verified dist directory for GitHub Pages.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 11.25.0
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Lint source and configuration
      shell: bash
      run: pnpm lint

    - name: Find unused files and dependencies
      shell: bash
      run: pnpm static

    - name: Audit installed dependencies
      shell: bash
      run: pnpm audit --audit-level=moderate

    - name: Check types and Astro files
      shell: bash
      run: pnpm check

    - name: Run tests with coverage
      shell: bash
      run: pnpm test:coverage

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-report
        path: coverage
        if-no-files-found: error

    - name: Build site
      shell: bash
      run: pnpm build

    - name: Test rendered routes
      shell: bash
      run: pnpm test:routes

    - name: Install browser for rendered-page review
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: Review rendered pages
      shell: bash
      run: pnpm test:visual

    - name: Upload rendered-page review artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: rendered-page-review
        path: .artifacts/visual-review
        if-no-files-found: ignore

    - name: Upload verified Pages artifact
      if: inputs.upload-pages-artifact == 'true'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: dist
